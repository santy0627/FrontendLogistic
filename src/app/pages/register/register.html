<div class="container-fluid content">
    <div class="row h-100">
        <div class="col-md-6 bg-primary d-flex align-items-center justify-content-center">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h1 class="card-title text-center mb-5">Registro</h1>

                    <div class="alert alert-danger" *ngIf="error">
                        {{ error }}
                    </div>
                            
                    <form [formGroup]="registerForm" (ngSubmit)="register()">
                                
                        <div class="mb-3">
                            <input type="text" class="form-control" id="nombre" required placeholder="nombre" formControlName="nombre" [class.is-invalid] = "getFieldErrors('nombre')">
                            <small class="text-danger" *ngIf="getFieldErrors('nombre')">
                                {{ getFieldErrors('nombre') }}
                            </small>
                        </div>

                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" required placeholder="email" formControlName="email" [class.is-invalid] = "getFieldErrors('email')">
                            <small class="text-danger" *ngIf="getFieldErrors('email')">
                                {{ getFieldErrors('email') }}
                            </small>
                        </div>

                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" required placeholder="password" formControlName="password" [class.is-invalid] = "getFieldErrors('password')">
                            <small class="text-danger" *ngIf="getFieldErrors('password')">
                                {{ getFieldErrors('password') }}
                            </small>
                        </div>

                        <div class="mb-3">
                            <select class="form-select" id="role" required formControlName="role" [class.is-invalid] = "getFieldErrors('role')">
                                <option value="" disabled selected>Seleccione un rol</option>
                                <option value="admin">Administrador</option>
                                <option value="auxiliar">Auxiliar</option>
                                <option value="conductor">Conductor</option>
                            </select>
                            <small class="text-danger" *ngIf="getFieldErrors('role')">
                                {{ getFieldErrors('role') }}
                            </small>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-5">
                            <button type="submit" class="btn btn-warning text-white">Registrarse</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <div class="ant col-md-6 justify-content-center">
            <img src="hormiga.svg" alt="hormiga">
        </div>
    </div>
</div>
