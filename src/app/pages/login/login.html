<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow bg-primary text-white">
                <div class="card-body p-5">
                    <h1 class="card-title text-center mb-5">Inicio de sesión</h1>

                    <form [formGroup]="loginForm" (ngSubmit)="login()">

                        <div class="mb-3">
                            <input type="email" class="form-control" id="email" required placeholder="email" formControlName="email">
                            <div class="invalid-feedback">Por favor ingrese un email válido</div>
                        </div>

                        <div class="mb-3">
                            <input type="password" class="form-control" id="password" required placeholder="password" formControlName="password">
                            <div class="invalid-feedback">Porfavor ingrese una password</div>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-5">
                            <button type="submit" class="btn btn-warning text-white">Ingresar</button>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
