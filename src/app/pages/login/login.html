<div class="container-fluid content">
  <div class="row h-100">
    <div class="ant col-md-6 d-md-flex justify-content-center align-items-end">
      <img src="hormiga-login.svg" alt="hormiga-login" />
    </div>

    <div class="col-md-6 bg-primary d-flex align-items-center justify-content-center">
      <div class="card shadow">
        <div class="card-body p-5">
          <div class="card-title text-center mb-5">
            <h1>BIENVENIDO</h1>
            <p>Nos alegra verte de nuevo por aqui</p>
          </div>

          <div class="alert alert-danger" *ngIf="error">
            {{ error }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="mb-3">
              <input
                type="email"
                class="form-control"
                id="email"
                required
                placeholder="email"
                formControlName="email"
                [class.is-invalid]="getFieldErrors('email')"
              />
              <small class="text-danger" *ngIf="getFieldErrors('email')">
                {{ getFieldErrors('email') }}
              </small>
            </div>

            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                id="password"
                required
                placeholder="password"
                formControlName="password"
                [class.is-invalid]="getFieldErrors('password')"
              />
              <small class="text-danger" *ngIf="getFieldErrors('password')">
                {{ getFieldErrors('password') }}
              </small>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-5">
              <button type="submit" class="btn btn-warning text-white btn-form">
                Iniciar sesión
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
